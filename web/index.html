<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zip-lab · ZIP 读写器实验室</title>
<style>
  :root {
    --bg: #0e1116; --panel: #151a22; --panel2: #1b2230; --line: #2a3342;
    --fg: #d8dee9; --dim: #8a94a6; --acc: #5cc8ff; --ok: #7ee787; --warn: #ffa657; --err: #ff7b72;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: baseline; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  #drop {
    margin: 14px; padding: 44px 20px; border: 2px dashed var(--line); border-radius: 12px;
    text-align: center; color: var(--dim); cursor: pointer; transition: all .15s;
  }
  #drop.hover { border-color: var(--acc); color: var(--acc); background: rgba(92,200,255,.06); }
  #drop b { color: var(--fg); }
  #meta { margin: 0 14px 10px; font-size: 12px; color: var(--dim); line-height: 1.7; }
  #meta .chip { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; margin-right: 6px; }
  #tree { margin: 0 14px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 13px; max-height: 60vh; }
  .node { user-select: none; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .row:hover { background: var(--panel2); }
  .row.sel { background: rgba(92,200,255,.12); }
  .row .tw { width: 12px; color: var(--dim); font-size: 10px; }
  .row input { accent-color: var(--acc); }
  .row .name { overflow: hidden; text-overflow: ellipsis; }
  .row .sz { color: var(--dim); font-size: 11px; margin-left: auto; }
  .row.dir .name { color: var(--warn); }
  #right { display: flex; flex-direction: column; border-left: 1px solid var(--line); min-width: 0; }
  #rightHead { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  #rightHead .path { font-weight: 600; word-break: break-all; }
  #rightHead .info { color: var(--dim); font-size: 12px; }
  #viewer { flex: 1; overflow: auto; padding: 12px 16px; font-size: 13px; }
  #viewer pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; line-height: 1.5; }
  #viewer img { max-width: 100%; max-height: 70vh; border: 1px solid var(--line); border-radius: 8px; }
  #viewer .hex { color: var(--dim); }
  #actions { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--acc); color: var(--acc); }
  button.primary { background: var(--acc); color: #06121b; border-color: var(--acc); font-weight: 600; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #status { color: var(--dim); font-size: 12px; margin-left: auto; }
  #status.err { color: var(--err); }
  footer { padding: 8px 20px; color: var(--dim); font-size: 11px; border-top: 1px solid var(--line); }
  a { color: var(--acc); }
</style>
</head>
<body>
<header>
  <h1>zip-lab</h1>
  <span class="sub">零依赖手写 ZIP 读写器 · 拖入 .zip 即时解析（全部在本机浏览器内完成，不上传）</span>
</header>
<main>
  <section>
    <div id="drop">拖一个 <b>.zip</b> 到这里，或点击选择文件<br><span style="font-size:12px">支持 stored / deflate / ZIP64 / 数据描述符 / UTF-8 与 CP437 文件名</span></div>
    <input id="file" type="file" accept=".zip,application/zip" style="display:none">
    <div id="meta" hidden></div>
    <div id="tree" hidden></div>
  </section>
  <section id="right">
    <div id="rightHead"><span class="path">（未选择条目）</span><span class="info"></span></div>
    <div id="viewer">解析一个 zip 后，点左侧条目预览内容。</div>
    <div id="actions">
      <label><input id="all" type="checkbox"> 全选</label>
      <button id="repack" class="primary" disabled>重打包选中条目并下载</button>
      <span id="status"></span>
    </div>
  </section>
</main>
<footer>
  zip-codec · PKWARE APPNOTE 模型（本地文件头 + 中央目录）· 加密条目仅解析标志并拒绝 ·
  <a href="https://developers.cloudflare.com/pages/" target="_blank" rel="noreferrer">Cloudflare Pages</a> 单文件部署
</footer>
<!--BUNDLE-->
</body>
</html>
